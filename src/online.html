<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斗鸡 Online · 好友联机</title>
<style>
:root{color-scheme:dark;--bg:#081017;--panel:#101c26;--line:#284052;--accent:#65d6b4;--muted:#91a6b5;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#183141 0,#081017 46%);color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,select,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:24px;font-weight:800}.badge{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--accent)}.panel{background:rgba(16,28,38,.95);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 38px #0007}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lobby{max-width:740px;margin:50px auto}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1620;cursor:pointer}.hero.active{outline:2px solid var(--accent)}.hero small,.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{background:var(--accent);color:#062018;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{background:#172a38;color:#eef8ff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}.danger{background:#3b1d23;color:#ffd9dc;border:1px solid #78404a}.hidden{display:none!important}.roomcode{font:800 30px ui-monospace,monospace;letter-spacing:5px;color:#fff}.battle{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1620;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:19px}.hand{display:grid;gap:8px}.card{background:#0b1620;border:1px solid var(--line);border-radius:12px;padding:10px}.card.playable{border-color:#3e806d}.card h4{margin:0 0 5px}.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.act{background:#142838;border:1px solid #38556a;color:#eef8ff;border-radius:11px;padding:10px;text-align:left;cursor:pointer}.act:hover{border-color:var(--accent)}.act:disabled{opacity:.5;cursor:not-allowed}.map{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:620px;margin:10px auto}.cell{aspect-ratio:1;border:1px solid #273c4b;border-radius:8px;background:#0b1620;display:grid;place-items:center;font-size:12px;color:#708695}.cell.a{background:#174538;color:#dff}.cell.b{background:#562b32;color:#fff}.cell.ab{background:#594a18}.status{padding:8px 10px;border-radius:10px;background:#0b1620;border:1px solid var(--line)}#toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#101c26;border:1px solid var(--line);padding:12px 14px;border-radius:12px;display:none}.error{color:var(--danger)}@media(max-width:860px){.battle,.grid{grid-template-columns:1fr}.heroes{grid-template-columns:1fr 1fr}.battle{margin-top:8px}}
#combatAnnouncer{position:fixed;z-index:80;left:50%;top:15%;transform:translate(-50%,-8px) scale(.985);min-width:min(470px,76vw);max-width:86vw;padding:10px 18px;border:1px solid rgba(125,188,221,.48);border-radius:12px;background:rgba(9,26,39,.94);box-shadow:0 12px 34px rgba(0,0,0,.42);text-align:center;pointer-events:none;opacity:0;transition:opacity .18s ease,transform .22s ease;backdrop-filter:blur(4px)}
#combatAnnouncer.show{opacity:1;transform:translate(-50%,0) scale(1)}#combatAnnouncer .cue-kicker{font-size:11px;letter-spacing:.18em;color:#9bcbe1}#combatAnnouncer .cue-main{font-size:20px;font-weight:800;margin-top:3px;color:#eef9ff}
#combatAnnouncer.ultimate{border-color:rgba(239,188,92,.78)}#combatAnnouncer.ultimate .cue-main{color:#ffe7a9}#combatAnnouncer.skill .cue-main{color:#d9ffe5}#combatAnnouncer.combo .cue-main{color:#bff7ff}
.panel.hit-feedback{animation:onlineHit .26s ease-out}.panel.heal-feedback{animation:onlineHeal .34s ease-out}.battle.impact-feedback{animation:onlineImpact .28s ease-out}
@keyframes onlineHit{0%,100%{transform:translateX(0)}35%{transform:translateX(-4px)}65%{transform:translateX(2px)}}@keyframes onlineHeal{50%{filter:brightness(1.12)}}@keyframes onlineImpact{50%{filter:brightness(1.08)}}
@media(prefers-reduced-motion:reduce){#combatAnnouncer{transition:none}.panel.hit-feedback,.panel.heal-feedback,.battle.impact-feedback{animation-duration:.01ms!important}}</style></head><body><div class="wrap">
<div class="top"><div class="brand">🐓 斗鸡 Online <span class="badge">Authoritative Server</span></div><div id="conn" class="muted">连接中…</div></div>
<section id="lobby" class="panel lobby"><h2>好友联机</h2><p class="muted">服务器持有唯一真实 GameState；客户端只收到本方 Observation 与本方合法动作。创建房间后把邀请链接发给朋友即可。</p><label>昵称（可选） <input id="name" maxlength="20" placeholder="玩家" style="width:180px"></label><h3>选择角色</h3><div id="heroes" class="heroes"></div><div class="row" style="margin-top:14px"><button id="create" class="primary">创建房间</button><input id="roomInput" maxlength="6" placeholder="房间码" style="text-transform:uppercase;padding:9px;border-radius:9px;border:1px solid var(--line);background:#081017;color:white"><button id="join" class="secondary">加入房间</button></div><p id="lobbyMsg" class="muted"></p></section>
<section id="waiting" class="panel lobby hidden"><h2>房间已创建</h2><div id="roomCode" class="roomcode"></div><p class="muted">等待另一位玩家加入。房间保存在当前 Node 进程内；服务器重启后房间失效。</p><div class="row"><button id="copyInvite" class="primary">复制邀请链接</button><button id="copyCode" class="secondary">复制房间码</button></div><p id="playersWaiting"></p></section>
<section id="game" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><b id="roomTitle"></b> · <span id="phase"></span></div><div class="row"><span id="turnStatus" class="status"></span><button id="rematch" class="secondary hidden">申请重赛</button><button id="surrender" class="secondary danger">投降</button></div></div></div>
<div class="battle"><div><div id="me" class="panel"></div><div id="opp" class="panel" style="margin-top:14px"></div><div class="panel" style="margin-top:14px"><h3>我的手牌</h3><div id="hand" class="hand"></div></div></div><div><div class="panel"><h3>地图位置</h3><div id="map" class="map"></div><p class="muted">A / B 为双方当前坐标。地图用于快速定位；完整合法移动以服务器返回的动作按钮为准。</p></div><div class="panel" style="margin-top:14px"><h3>当前合法动作</h3><div id="actions" class="actions"></div></div></div></div></section>
</div><div id="toast"></div><div id="combatAnnouncer" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s); let ws=null,catalog=null,selectedHero='luoji',roomId=null,side=null,token=null,snap=null,busy=false,lastFxSnap=null;
const saved=()=>{try{return JSON.parse(localStorage.getItem('douji-online-session')||'null')}catch{return null}};
function save(){if(roomId&&token)localStorage.setItem('douji-online-session',JSON.stringify({roomId,token}))}
function toast(t,err=false){const e=$('#toast');e.textContent=t;e.className=err?'error':'';e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
const combatCueQueue=[];let combatCueBusy=false;function combatCue(kind,kicker,main){if(!main)return;combatCueQueue.push({kind,kicker,main});if(combatCueBusy)return;const run=()=>{const q=combatCueQueue.shift();if(!q){combatCueBusy=false;return}combatCueBusy=true;const n=$('#combatAnnouncer');n.className=q.kind||'';n.innerHTML=`<div class="cue-kicker">${q.kicker||''}</div><div class="cue-main">${q.main}</div>`;requestAnimationFrame(()=>n.classList.add('show'));setTimeout(()=>{n.classList.remove('show');setTimeout(run,170)},620)};run()}
function heroActionName(obs,ev){const p=obs.players?.[ev.side];if(ev.type==='skill')return p?.hero?.skills?.find(x=>x.id===ev.skillId)?.name||ev.name||'发动技能';if(ev.type==='ultimate')return p?.hero?.ultimates?.find(x=>x.id===ev.ultId)?.name||ev.name||'发动绝技';return ''}
function pulseOnlinePanel(absSide,heal=false){const node=absSide===side?$('#me'):$('#opp');if(!node)return;node.classList.remove('hit-feedback','heal-feedback');void node.offsetWidth;node.classList.add(heal?'heal-feedback':'hit-feedback');setTimeout(()=>node.classList.remove('hit-feedback','heal-feedback'),380)}
function onlineTransitionFx(prev,m){const obs=m.observation;if(!prev?.observation||!obs||m.seq<=prev.seq)return;const old=prev.observation;for(let i=0;i<2;i++){const d=(obs.players?.[i]?.hp??0)-(old.players?.[i]?.hp??0);if(d<0)pulseOnlinePanel(i,false);else if(d>0)pulseOnlinePanel(i,true)}if(obs.players?.some((p,i)=>(p.hp??0)<(old.players?.[i]?.hp??0))){const b=document.querySelector('.battle');if(b){b.classList.remove('impact-feedback');void b.offsetWidth;b.classList.add('impact-feedback');setTimeout(()=>b.classList.remove('impact-feedback'),320)}}const oldN=old.log?.length||0,newEvents=(obs.log||[]).slice(oldN);for(const ev of newEvents){const who=ev.side===side?'我方':'对手',hero=obs.players?.[ev.side]?.hero?.name||'斗士';if(ev.type==='ultimate')combatCue('ultimate',who+'绝技',`${hero} · ${heroActionName(obs,ev)}`);else if(ev.type==='skill')combatCue('skill',who+'技能',`${hero} · ${heroActionName(obs,ev)}`);else if(ev.type==='resolve'){const r=ev.log||{},step=r.stepNum||r.step||0;if(step>1)combatCue('combo',who+'连击',`第 ${step} 连击 · ${r.cardName||'追击'}`);else combatCue('combo',who+'攻击',r.cardName||'攻击')}}if((obs.expansionCount??0)>(old.expansionCount??0)){const next=obs.activeSide??obs.expansion?.initiativeSide??0;combatCue('expansion','展开推进',`第 ${(obs.expansionCount??0)+1} 展开 · ${obs.players?.[next]?.hero?.name||'下一方'}`)}}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o));}
function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host+'/ws');ws.onopen=()=>{$('#conn').textContent='已连接';const q=new URLSearchParams(location.search),s=saved(),qr=q.get('room'),qt=q.get('token');let rid=null,t=null;if(qr&&qt){rid=qr;t=qt}else if(qr&&s?.roomId===qr&&s?.token){rid=qr;t=s.token}else if(!qr&&s?.roomId&&s?.token){rid=s.roomId;t=s.token}if(rid&&t)send({type:'RESUME',roomId:rid,token:t});};ws.onclose=()=>{$('#conn').textContent='已断线，正在重连…';setTimeout(connect,1200)};ws.onerror=()=>{};ws.onmessage=e=>handle(JSON.parse(e.data));}
function handle(m){if(m.type==='WELCOME'){catalog=m.catalog;roomId=m.roomId;side=m.side;token=m.token;save();renderHeroes();history.replaceState(null,'',location.pathname+'?room='+roomId);}
 else if(m.type==='ROOM'){renderRoom(m.room)}
 else if(m.type==='SNAPSHOT'||m.type==='STALE'){snap=m;renderGame(m)}
 else if(m.type==='ERROR'){toast(m.error,true);if(m.resumeFailed){localStorage.removeItem('douji-online-session');const q=new URLSearchParams(location.search),r=q.get('room');history.replaceState(null,'',location.pathname+(r?'?room='+encodeURIComponent(r):''));showLobby();if(r)$('#roomInput').value=r.toUpperCase();}}
}
function fallbackHeroes(){return {luoji:{id:'luoji',name:'洛基',title:'白洛克鸡',hp:21,emoji:'🥊'},chiyu:{id:'chiyu',name:'赤羽战魂',title:'火鸡',hp:25,emoji:'🔥'},lafeng:{id:'lafeng',name:'拉封骑士',title:'法国雄鸡',hp:24,emoji:'⚔️'},qiu013:{id:'qiu013',name:'囚徒013',title:'激素怪鸡',hp:27,emoji:'🧪'},baiye:{id:'baiye',name:'白夜',title:'丑小鸭',hp:27,emoji:'🦢'},lanyu:{id:'lanyu',name:'岚羽',title:'雉鸡',hp:25,emoji:'🪶'},youying:{id:'youying',name:'游影·麻步',title:'麻鸡',hp:25,emoji:'🌫️'},xuanyi:{id:'xuanyi',name:'玄医·乌骨',title:'乌鸡',hp:28,emoji:'☯️'},fayoum:{id:'fayoum',name:'法尤姆·命织者',title:'埃及鸡',hp:30,emoji:'🔮'}}}
function renderHeroes(){const hs=catalog?.heroes||fallbackHeroes();$('#heroes').innerHTML='';Object.values(hs).forEach(h=>{const d=document.createElement('div');d.className='hero '+(h.id===selectedHero?'active':'');d.innerHTML=`<b>${h.emoji||'🐓'} ${h.name}</b><br><small>${h.title} · HP ${h.hp}</small>`;d.onclick=()=>{selectedHero=h.id;renderHeroes()};$('#heroes').append(d)})}
function showLobby(){['#waiting','#game'].forEach(x=>$(x).classList.add('hidden'));$('#lobby').classList.remove('hidden');renderHeroes()}
function renderRoom(r){roomId=r.roomId;if(r.started)return;$('#lobby').classList.add('hidden');$('#game').classList.add('hidden');$('#waiting').classList.remove('hidden');$('#roomCode').textContent=roomId;$('#playersWaiting').textContent=(r.players.filter(Boolean).map(p=>`${p.side===0?'A':'B'}：${(catalog?.heroes||fallbackHeroes())[p.heroId]?.name||p.heroId}${p.connected?'（在线）':'（离线）'}`).join(' · '));}
function heroName(p){return p?.hero?.name||'未知'}
function pbox(p,title){if(!p)return `<h3>${title}</h3>`;const handN=Array.isArray(p.hand)?p.hand.length:0,deckN=Array.isArray(p.deck)?p.deck.length:0;return `<h3>${title} · ${heroName(p)}</h3><div class="stats"><div class="stat"><small>生命</small><b>${p.hp}</b></div><div class="stat"><small>能量</small><b>${p.energy}</b></div><div class="stat"><small>气</small><b>${p.qi}</b></div></div><p class="muted">手牌 ${handN} · 牌库 ${deckN} · 位置 (${p.pos?.r??'?'},${p.pos?.c??'?'})</p>`}
function renderMap(obs){const m=$('#map');m.innerHTML='';const a=obs.players?.[0]?.pos,b=obs.players?.[1]?.pos;for(let r=0;r<9;r++)for(let c=0;c<9;c++){const d=document.createElement('div');const A=a&&a.r===r&&a.c===c,B=b&&b.r===r&&b.c===c;d.className='cell '+(A&&B?'ab':A?'a':B?'b':'');d.textContent=A&&B?'AB':A?'A':B?'B':`${r},${c}`;m.append(d)}}
function actLabel(a){let s='';if(a.kind==='play_card'||a.kind==='counter')s=`${a.kind==='counter'?'反击':'出牌'}：${a.cardName||''}`;else if(a.kind==='use_skill')s=`技能：${a.name||a.skill?.name||a.skillId}`;else if(a.kind==='use_ultimate')s=`绝技：${a.name||a.ultimate?.name||a.ultimateId||''}`;else if(a.kind==='tactical_step')s='战术移动';else if(a.kind==='end')s='收势 / 结束';else if(a.kind==='pass')s='放弃响应';else if(a.kind==='supply_choice')s=`补给：${a.label||a.option}`;else if(a.kind==='resolve_choice'||a.kind==='pending_choice')s=`选择：${a.label||a.option||a.choice||''}`;else s=a.label||a.name||a.kind;if(a.dest)s+=` → (${a.dest.r},${a.dest.c})`;if(a.cost)s+=` · ${a.cost}能`;return s}
function renderHand(obs,legal){const hand=obs.players?.[side]?.hand||[],root=$('#hand');root.innerHTML='';hand.forEach(c=>{const playable=legal.some(a=>a.cardInstanceId===c.instanceId||a.cardKey===c.instanceId);const d=document.createElement('div');d.className='card '+(playable?'playable':'');d.innerHTML=`<h4>${c.name||'未知牌'} ${playable?'✓':''}</h4><div class="muted">${c.type||''} · 费用 ${c.cost??'?'} · ${c.rulesText||c.effect||''}</div>`;root.append(d)});if(!hand.length)root.innerHTML='<span class="muted">当前无手牌</span>'}
function renderActions(legal){const root=$('#actions');root.innerHTML='';if(!legal.length){root.innerHTML='<span class="muted">现在不是你的操作时点，等待对手。</span>';return}legal.forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=actLabel(a);b.disabled=busy;b.onclick=()=>{if(busy)return;busy=true;send({type:'COMMAND',baseSeq:snap.seq,actionId:a.actionId});setTimeout(()=>busy=false,600)};root.append(b)})}
function renderGame(m){const prev=lastFxSnap;const obs=m.observation;if(!obs)return;$('#lobby').classList.add('hidden');$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');$('#roomTitle').textContent=`房间 ${m.room.roomId} · 你是 ${side===0?'A':'B'}`;$('#phase').textContent=`阶段 ${obs.phase} · 序号 ${m.seq}`;$('#me').innerHTML=pbox(obs.players?.[side],'我方');$('#opp').innerHTML=pbox(obs.players?.[1-side],'对手');renderMap(obs);renderHand(obs,m.legalActions||[]);renderActions(m.legalActions||[]);const finished=m.finished||((obs.winner!==null&&obs.winner!==undefined)?{winner:obs.winner,reason:'CORE_WIN'}:null);if(finished){const win=finished.winner==='draw'?'平局':Number(finished.winner)===side?'你获胜':'你落败';$('#turnStatus').textContent=`对局结束：${win}`;$('#rematch').classList.remove('hidden');$('#surrender').classList.add('hidden')}else{$('#turnStatus').textContent=(m.legalActions||[]).length?'轮到你操作':'等待对手';$('#rematch').classList.add('hidden');$('#surrender').classList.remove('hidden')}onlineTransitionFx(prev,m);lastFxSnap=m;busy=false;}
$('#create').onclick=()=>send({type:'CREATE_ROOM',heroId:selectedHero,name:$('#name').value});$('#join').onclick=()=>{const r=$('#roomInput').value.trim().toUpperCase();if(!r)return toast('请输入房间码',true);send({type:'JOIN_ROOM',roomId:r,heroId:selectedHero,name:$('#name').value})};$('#copyInvite').onclick=async()=>{const u=location.origin+location.pathname+'?room='+roomId;await navigator.clipboard.writeText(u);toast('邀请链接已复制')};$('#copyCode').onclick=async()=>{await navigator.clipboard.writeText(roomId);toast('房间码已复制')};$('#surrender').onclick=()=>{if(confirm('确定投降？'))send({type:'SURRENDER'})};$('#rematch').onclick=()=>{send({type:'REMATCH'});toast('已申请重赛，等待对手同意')};
const q=new URLSearchParams(location.search);if(q.get('room')&&!q.get('token'))$('#roomInput').value=q.get('room').toUpperCase();renderHeroes();connect();
</script></body></html>
